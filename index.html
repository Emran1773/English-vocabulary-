<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<link rel="icon" type="image/jpeg" href="icon.JPG">
<link rel="apple-touch-icon" href="icon.JPG">

<meta name="theme-color" content="#0b1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>قاموس الإنجليزية</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#080d19;
    --bg2:#0e1627;
    --panel:rgba(255,255,255,.055);
    --panel2:rgba(255,255,255,.085);
    --border:rgba(255,255,255,.09);
    --text:#f8fafc;
    --muted:#94a3b8;
    --accent:#6366f1;
    --accent2:#22d3ee;
    --success:#22c55e;
    --danger:#ef4444;
    --shadow:0 20px 60px rgba(0,0,0,.35);
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    font-family:Arial,"Tahoma",sans-serif;
    background:
        radial-gradient(circle at 15% 10%,rgba(99,102,241,.14),transparent 28%),
        radial-gradient(circle at 85% 80%,rgba(34,211,238,.09),transparent 30%),
        var(--bg);
    color:var(--text);
    overflow-x:hidden;
}

button,
input{
    font:inherit;
}

button{
    cursor:pointer;
}

.app{
    min-height:100vh;
    display:flex;
}

.sidebar{
    position:fixed;
    top:0;
    right:0;
    width:270px;
    height:100vh;
    padding:25px 18px;
    background:rgba(8,13,25,.9);
    backdrop-filter:blur(22px);
    border-left:1px solid var(--border);
    z-index:100;
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
    padding:5px 8px 28px;
}

.logo-icon{
    width:46px;
    height:46px;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(99,102,241,.2);
}

.logo-icon img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.logo-text{
    font-size:19px;
    font-weight:800;
}

.logo-sub{
    color:var(--muted);
    font-size:11px;
    margin-top:3px;
}

.nav{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.nav button{
    width:100%;
    border:0;
    background:transparent;
    color:var(--muted);
    padding:14px 15px;
    border-radius:14px;
    text-align:right;
    transition:.2s;
}

.nav button:hover,
.nav button.active{
    background:var(--panel2);
    color:var(--text);
}

.nav button.active{
    box-shadow:inset -3px 0 var(--accent);
}

.nav-icon{
    display:inline-flex;
    width:27px;
    font-size:16px;
}

.main{
    width:calc(100% - 270px);
    margin-right:270px;
    min-height:100vh;
    padding:34px;
}

.topbar{
    max-width:1250px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    margin-bottom:32px;
}

.mobile-menu{
    display:none;
    border:1px solid var(--border);
    background:var(--panel);
    color:var(--text);
    width:44px;
    height:44px;
    border-radius:13px;
}

.hero{
    max-width:1250px;
    margin:0 auto 30px;
    padding:38px;
    border:1px solid var(--border);
    border-radius:28px;
    background:
        linear-gradient(135deg,rgba(99,102,241,.15),rgba(34,211,238,.04)),
        var(--panel);
    box-shadow:var(--shadow);
}

.hero h1{
    font-size:clamp(28px,4vw,48px);
    line-height:1.2;
    margin-bottom:12px;
}

.hero p{
    color:var(--muted);
    font-size:16px;
    line-height:1.8;
    max-width:650px;
}

.search{
    max-width:1250px;
    margin:0 auto 25px;
    position:relative;
}

.search input{
    width:100%;
    height:58px;
    border:1px solid var(--border);
    border-radius:18px;
    outline:none;
    padding:0 54px 0 18px;
    background:var(--panel);
    color:var(--text);
    transition:.2s;
}

.search input:focus{
    border-color:rgba(99,102,241,.65);
    box-shadow:0 0 0 4px rgba(99,102,241,.08);
}

.search span{
    position:absolute;
    right:19px;
    top:50%;
    transform:translateY(-50%);
    color:var(--muted);
}

.content{
    max-width:1250px;
    margin:auto;
}

.toolbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    margin-bottom:22px;
    flex-wrap:wrap;
}

.filters{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.filter{
    border:1px solid var(--border);
    background:var(--panel);
    color:var(--muted);
    padding:10px 15px;
    border-radius:12px;
    transition:.2s;
}

.filter:hover,
.filter.active{
    background:rgba(99,102,241,.16);
    color:var(--text);
    border-color:rgba(99,102,241,.35);
}

.add-btn{
    border:0;
    color:white;
    background:linear-gradient(135deg,var(--accent),#818cf8);
    padding:12px 20px;
    border-radius:13px;
    font-weight:700;
    box-shadow:0 10px 25px rgba(99,102,241,.22);
}

.words-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:17px;
}

.word-card{
    border:1px solid var(--border);
    background:var(--panel);
    border-radius:21px;
    padding:22px;
    min-height:190px;
    transition:.25s;
    position:relative;
    overflow:hidden;
}

.word-card:hover{
    transform:translateY(-4px);
    border-color:rgba(99,102,241,.3);
    background:var(--panel2);
}

.word-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
}

.word{
    font-size:27px;
    font-weight:800;
    direction:ltr;
    text-align:left;
}

.type{
    color:var(--accent2);
    font-size:12px;
    margin-top:5px;
}

.meaning{
    font-size:17px;
    margin-top:20px;
    line-height:1.7;
}

.example{
    color:var(--muted);
    font-size:13px;
    line-height:1.7;
    margin-top:10px;
}

.actions{
    display:flex;
    gap:7px;
    margin-top:18px;
}

.icon-btn{
    width:36px;
    height:36px;
    border-radius:10px;
    border:1px solid var(--border);
    background:rgba(255,255,255,.04);
    color:var(--muted);
}

.icon-btn:hover{
    color:var(--text);
    background:var(--panel2);
}

.favorite.active{
    color:#facc15;
}

.empty{
    display:none;
    text-align:center;
    padding:70px 20px;
    color:var(--muted);
    border:1px dashed var(--border);
    border-radius:22px;
}

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
    backdrop-filter:blur(8px);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:200;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:min(550px,100%);
    background:#101827;
    border:1px solid var(--border);
    border-radius:25px;
    padding:26px;
    box-shadow:var(--shadow);
}

.modal-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:24px;
}

.modal-head h2{
    font-size:23px;
}

.close{
    width:38px;
    height:38px;
    border:1px solid var(--border);
    background:var(--panel);
    color:var(--text);
    border-radius:11px;
}

.form{
    display:grid;
    gap:14px;
}

.form-group{
    display:grid;
    gap:7px;
}

.form-group label{
    color:var(--muted);
    font-size:13px;
}

.form-group input{
    width:100%;
    height:48px;
    border-radius:13px;
    border:1px solid var(--border);
    outline:none;
    background:rgba(255,255,255,.045);
    color:var(--text);
    padding:0 14px;
}

.form-group input:focus{
    border-color:rgba(99,102,241,.65);
}

.save{
    height:50px;
    border:0;
    border-radius:13px;
    color:white;
    font-weight:700;
    background:linear-gradient(135deg,var(--accent),#818cf8);
    margin-top:5px;
}

.toast{
    position:fixed;
    left:22px;
    bottom:22px;
    background:#121c2d;
    border:1px solid var(--border);
    padding:13px 18px;
    border-radius:13px;
    color:var(--text);
    transform:translateY(100px);
    opacity:0;
    transition:.3s;
    z-index:500;
}

.toast.show{
    transform:translateY(0);
    opacity:1;
}

@media(max-width:1050px){
    .words-grid{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:800px){
    .sidebar{
        transform:translateX(100%);
        transition:.3s;
    }

    .sidebar.open{
        transform:translateX(0);
    }

    .main{
        width:100%;
        margin-right:0;
        padding:20px;
    }

    .mobile-menu{
        display:block;
    }

    .topbar{
        margin-bottom:20px;
    }

    .hero{
        padding:27px;
        border-radius:22px;
    }
}

@media(max-width:620px){
    .words-grid{
        grid-template-columns:1fr;
    }

    .hero h1{
        font-size:30px;
    }

    .hero p{
        font-size:14px;
    }

    .toolbar{
        align-items:stretch;
    }

    .filters{
        width:100%;
    }

    .add-btn{
        width:100%;
    }
}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar" id="sidebar">
    <div class="logo">
        <div class="logo-icon">
            <img src="icon.JPG" alt="قاموس الإنجليزية">
        </div>
        <div>
            <div class="logo-text">قاموس الإنجليزية</div>
            <div class="logo-sub">تعلّم كلمة كل يوم</div>
        </div>
    </div>

    <nav class="nav">
        <button class="active" data-page="all">
            <span class="nav-icon">📚</span>
            كل الكلمات
        </button>

        <button data-page="favorites">
            <span class="nav-icon">★</span>
            المفضلة
        </button>

        <button data-page="learned">
            <span class="nav-icon">✓</span>
            تعلّمتها
        </button>
    </nav>
</aside>

<main class="main">

    <div class="topbar">
        <button class="mobile-menu" id="mobileMenu">☰</button>
        <div></div>
    </div>

    <section class="hero">
        <h1>وسّع مفرداتك.</h1>
        <p>
            اجمع كلماتك الإنجليزية، راجع معانيها، واحفظ الكلمات المهمة
            لتبني قاموسك الشخصي بطريقة بسيطة ومنظمة.
        </p>
    </section>

    <div class="search">
        <span>⌕</span>
        <input id="searchInput" type="search" placeholder="ابحث عن كلمة أو معنى...">
    </div>

    <section class="content">

        <div class="toolbar">

            <div class="filters">
                <button class="filter active" data-filter="all">الكل</button>
                <button class="filter" data-filter="noun">اسم</button>
                <button class="filter" data-filter="verb">فعل</button>
                <button class="filter" data-filter="adjective">صفة</button>
                <button class="filter" data-filter="other">أخرى</button>
            </div>

            <button class="add-btn" id="addWord">+ إضافة كلمة</button>

        </div>

        <div class="words-grid" id="wordsGrid"></div>

        <div class="empty" id="empty">
            لا توجد كلمات مطابقة لبحثك.
        </div>

    </section>

</main>

</div>

<div class="modal" id="modal">
    <div class="modal-box">

        <div class="modal-head">
            <h2 id="modalTitle">إضافة كلمة</h2>
            <button class="close" id="closeModal">×</button>
        </div>

        <form class="form" id="wordForm">

            <div class="form-group">
                <label>الكلمة الإنجليزية</label>
                <input id="wordInput" dir="ltr" required>
            </div>

            <div class="form-group">
                <label>المعنى</label>
                <input id="meaningInput" required>
            </div>

            <div class="form-group">
                <label>نوع الكلمة</label>
                <input id="typeInput" placeholder="اسم / فعل / صفة / أخرى">
            </div>

            <div class="form-group">
                <label>مثال</label>
                <input id="exampleInput" dir="ltr" placeholder="Write an example sentence">
            </div>

            <button class="save" type="submit">حفظ الكلمة</button>

        </form>

    </div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";

const STORAGE_KEY = "english_dictionary_v1";

const defaultWords = [
    {
        id:1,
        word:"Knowledge",
        meaning:"المعرفة",
        type:"noun",
        typeLabel:"اسم",
        example:"Knowledge gives you the power to understand the world.",
        favorite:false,
        learned:false
    },
    {
        id:2,
        word:"Improve",
        meaning:"يُحسّن / يطوّر",
        type:"verb",
        typeLabel:"فعل",
        example:"I want to improve my English every day.",
        favorite:false,
        learned:false
    },
    {
        id:3,
        word:"Curious",
        meaning:"فضولي / محب للاستطلاع",
        type:"adjective",
        typeLabel:"صفة",
        example:"Curious minds ask better questions.",
        favorite:true,
        learned:false
    }
];

let words = JSON.parse(localStorage.getItem(STORAGE_KEY)) || defaultWords;
let currentFilter = "all";
let currentPage = "all";
let editingId = null;

const wordsGrid = document.getElementById("wordsGrid");
const empty = document.getElementById("empty");
const searchInput = document.getElementById("searchInput");
const modal = document.getElementById("modal");
const wordForm = document.getElementById("wordForm");
const wordInput = document.getElementById("wordInput");
const meaningInput = document.getElementById("meaningInput");
const typeInput = document.getElementById("typeInput");
const exampleInput = document.getElementById("exampleInput");
const modalTitle = document.getElementById("modalTitle");
const toast = document.getElementById("toast");
const sidebar = document.getElementById("sidebar");

function save(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(words));
}

function escapeHTML(value){
    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

function normalizeType(type){
    const value = type.trim().toLowerCase();

    if(
        value.includes("اسم") ||
        value.includes("noun")
    ) return {
        type:"noun",
        label:"اسم"
    };

    if(
        value.includes("فعل") ||
        value.includes("verb")
    ) return {
        type:"verb",
        label:"فعل"
    };

    if(
        value.includes("صفة") ||
        value.includes("adjective")
    ) return {
        type:"adjective",
        label:"صفة"
    };

    return {
        type:"other",
        label:"أخرى"
    };
}

function render(){

    const query = searchInput.value.trim().toLowerCase();

    let result = words.filter(item => {

        const matchesSearch =
            !query ||
            item.word.toLowerCase().includes(query) ||
            item.meaning.toLowerCase().includes(query) ||
            item.example.toLowerCase().includes(query);

        const matchesFilter =
            currentFilter === "all" ||
            item.type === currentFilter;

        let matchesPage = true;

        if(currentPage === "favorites"){
            matchesPage = item.favorite;
        }

        if(currentPage === "learned"){
            matchesPage = item.learned;
        }

        return matchesSearch && matchesFilter && matchesPage;
    });

    wordsGrid.innerHTML = "";

    if(!result.length){
        empty.style.display = "block";
        return;
    }

    empty.style.display = "none";

    result.forEach(item => {

        const card = document.createElement("article");
        card.className = "word-card";

        card.innerHTML = `
            <div class="word-top">
                <div>
                    <div class="word">${escapeHTML(item.word)}</div>
                    <div class="type">${escapeHTML(item.typeLabel || "أخرى")}</div>
                </div>
            </div>

            <div class="meaning">
                ${escapeHTML(item.meaning)}
            </div>

            <div class="example">
                ${escapeHTML(item.example || "لا يوجد مثال")}
            </div>

            <div class="actions">

                <button
                    class="icon-btn favorite ${item.favorite ? "active" : ""}"
                    data-action="favorite"
                    data-id="${item.id}"
                    title="المفضلة">
                    ★
                </button>

                <button
                    class="icon-btn"
                    data-action="learned"
                    data-id="${item.id}"
                    title="تم التعلم">
                    ${item.learned ? "✓" : "○"}
                </button>

                <button
                    class="icon-btn"
                    data-action="edit"
                    data-id="${item.id}"
                    title="تعديل">
                    ✎
                </button>

                <button
                    class="icon-btn"
                    data-action="delete"
                    data-id="${item.id}"
                    title="حذف">
                    ×
                </button>

            </div>
        `;

        wordsGrid.appendChild(card);
    });
}

function showToast(message){

    toast.textContent = message;
    toast.classList.add("show");

    clearTimeout(showToast.timer);

    showToast.timer = setTimeout(() => {
        toast.classList.remove("show");
    },2200);
}

function openModal(id = null){

    editingId = id;

    if(id){

        const item = words.find(word => word.id === id);

        if(!item) return;

        modalTitle.textContent = "تعديل الكلمة";
        wordInput.value = item.word;
        meaningInput.value = item.meaning;
        typeInput.value = item.typeLabel;
        exampleInput.value = item.example;

    }else{

        modalTitle.textContent = "إضافة كلمة";
        wordForm.reset();

    }

    modal.classList.add("show");
    setTimeout(() => wordInput.focus(),100);
}

function closeModal(){

    modal.classList.remove("show");
    editingId = null;
    wordForm.reset();

}

document.getElementById("addWord").addEventListener("click",() => {
    openModal();
});

document.getElementById("closeModal").addEventListener("click",closeModal);

modal.addEventListener("click",e => {
    if(e.target === modal){
        closeModal();
    }
});

wordForm.addEventListener("submit",e => {

    e.preventDefault();

    const typeData = normalizeType(typeInput.value);

    if(editingId){

        const item = words.find(word => word.id === editingId);

        if(item){

            item.word = wordInput.value.trim();
            item.meaning = meaningInput.value.trim();
            item.type = typeData.type;
            item.typeLabel = typeData.label;
            item.example = exampleInput.value.trim();

            showToast("تم تحديث الكلمة");

        }

    }else{

        words.unshift({
            id:Date.now(),
            word:wordInput.value.trim(),
            meaning:meaningInput.value.trim(),
            type:typeData.type,
            typeLabel:typeData.label,
            example:exampleInput.value.trim(),
            favorite:false,
            learned:false
        });

        showToast("تمت إضافة الكلمة");

    }

    save();
    render();
    closeModal();

});

wordsGrid.addEventListener("click",e => {

    const button = e.target.closest("[data-action]");

    if(!button) return;

    const id = Number(button.dataset.id);
    const action = button.dataset.action;

    const item = words.find(word => word.id === id);

    if(!item) return;

    if(action === "favorite"){

        item.favorite = !item.favorite;
        showToast(item.favorite ? "أضيفت إلى المفضلة" : "أزيلت من المفضلة");

    }

    if(action === "learned"){

        item.learned = !item.learned;
        showToast(item.learned ? "تم تسجيل الكلمة كمُتعلَّمة" : "أعيدت للمراجعة");

    }

    if(action === "edit"){
        openModal(id);
        return;
    }

    if(action === "delete"){

        words = words.filter(word => word.id !== id);
        showToast("تم حذف الكلمة");

    }

    save();
    render();

});

document.querySelectorAll(".filter").forEach(button => {

    button.addEventListener("click",() => {

        document.querySelectorAll(".filter").forEach(btn => {
            btn.classList.remove("active");
        });

        button.classList.add("active");

        currentFilter = button.dataset.filter;

        render();

    });

});

document.querySelectorAll(".nav button").forEach(button => {

    button.addEventListener("click",() => {

        document.querySelectorAll(".nav button").forEach(btn => {
            btn.classList.remove("active");
        });

        button.classList.add("active");

        currentPage = button.dataset.page;

        sidebar.classList.remove("open");

        render();

    });

});

searchInput.addEventListener("input",render);

document.getElementById("mobileMenu").addEventListener("click",() => {
    sidebar.classList.toggle("open");
});

document.addEventListener("keydown",e => {

    if(e.key === "Escape"){
        closeModal();
        sidebar.classList.remove("open");
    }

    if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k"){

        e.preventDefault();
        searchInput.focus();

    }

    if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "n"){

        e.preventDefault();
        openModal();

    }

});

render();
</script>

</body>
</html>
